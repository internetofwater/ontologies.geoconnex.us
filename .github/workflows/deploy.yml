name: Ontology Docs to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  OUTPUT_DIR: ./onto-to-pages-dist

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build Pages
        uses: cgs-earth/onto-to-pages@main
        with:
          input_dir: .
          output_dir: ${{ env.OUTPUT_DIR }}
          title: Geoconnex Ontologies
          deploy: 'false'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
